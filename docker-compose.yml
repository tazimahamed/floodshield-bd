# Usage: copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    build: {context: ., dockerfile: docker/db.Dockerfile}
    restart: unless-stopped
    environment:
      POSTGRES_USER: floodshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: floodshield
      TZ: Asia/Dhaka
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U floodshield]
      interval: 10s
      retries: 12

  app:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://floodshield:${POSTGRES_PASSWORD}@db:5432/floodshield
      DATA_DIR: /srv/data
    volumes:
      - ./data:/srv/data
      - ${EE_CREDENTIALS_DIR:-./ee-credentials}:/root/.config/earthengine:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment: {SITE_ADDRESS: "${SITE_ADDRESS:-:80}"}
    ports: ["80:80", "443:443"]
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]

# The app trusts X-Forwarded-For only from this network (docker/app.Dockerfile), and only Caddy publishes ports.
networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24}]

volumes: {pgdata: {}, caddy_data: {}}
