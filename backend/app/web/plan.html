function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("back").textContent = t.back; $("aboutL").textContent = t.about; $("lang").textContent = t.lang;
  $("eb").textContent = t.eb; $("h1").innerHTML = t.h1; $("lead").textContent = t.lead; $("cta1").textContent = t.cta1; $("cta2").textContent = t.cta2;
  $("facts").innerHTML = t.facts.map(([b, s]) => `<div class="fact"><b>${b}</b><span>${s}</span></div>`).join("");
  const w = t.who, p = t.price, c = t.cost, g = t.go, gl = t.global, sc = t.scale, n = t.nrb, k = t.kpi;
  $("main").innerHTML = `
  <section>${head(w)}<div class="split who">
    <div><h4>✅ ${w.getH}</h4><div class="grid">${w.get.map(x => card(t, x)).join("")}</div></div>
    <div><h4>💳 ${w.payH}</h4><div class="grid">${w.pay.map(x => card(t, x, "payer")).join("")}</div></div></div></section>
  <section class="band">${head(p)}<div class="flowbox">${moneySvg(p.flow)}</div>
    <div class="grid g3">${p.tiers.map(([nm, pr, u, f, items, pop]) => `<div class="card tier${pop ? " pop" : ""}">${pop ? `<span class="badge">${p.badge}</span>` : ""}<h3>${nm}</h3><div class="price">${pr} <small>${u}</small></div><div class="for">${f}</div><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
    <p class="sub" style="margin:16px 0 0">${p.extra}</p></section>
  <section>${head(c)}<div class="costs">${c.items.map(([b, s]) => `<div class="cost"><b>${b}</b><span>${s}</span></div>`).join("")}</div><p class="sub" style="margin:12px 0 0;font-size:14px">${c.fine}</p></section>
  <section>${head(g)}<div class="steps">${g.steps.map(([when, h, d, cur], i) => `<div class="step${cur ? " cur" : ""}"><div class="n">${i + 1}</div><b>${when}</b><h3>${h}</h3><p>${d}</p></div>`).join("")}</div></section>
  <section class="band">${head(gl)}<div class="world">${worldSvg()}<div><div class="countries">${gl.countries.map(([cd, nm, d, r]) => `<div class="ctry"><span class="code">${cd}</span><div style="flex:1"><b>${nm}</b><small>${d}</small><div class="bar"><i style="width:${r}%"></i></div></div></div>`).join("")}</div><p class="sub" style="margin:8px 0 0;font-size:13px">${gl.cbar}</p></div></div>
    <div class="how5">${gl.how.map(([h, d], i) => `<div><b>${i + 1}. ${h}</b>${d}</div>`).join("")}</div></section>
  <section>${head(sc)}<div class="how5">${sc.parts.map(([h, d]) => `<div><b>${h}</b>${d}</div>`).join("")}</div><div class="kpis">${sc.kpis.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div></section>
  <section class="band">${head(n)}<div class="nrb"><figure style="margin:0">${nrbSvg(n.cap)}<figcaption class="sub" style="margin:8px 0 0;font-size:13.5px;text-align:center">${n.cap}</figcaption></figure><div class="grid g2">${n.cards.map(x => card(t, x)).join("")}</div></div></section>
  <section>${head(k)}<table><tbody>${k.rows.map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join("")}</tbody></table>
    <div class="where"><h3>${t.honestH}</h3>${t.honest.map(([k, h, d]) => `<div class="wrow"><span class="dot ${k}"></span><b>${h}</b><span>${d}</span></div>`).join("")}</div></section>`;
  $("foot").textContent = t.foot;
}
$("lang").onclick = () => { lang = lang === "bn" ? "en" : "bn"; try { localStorage.setItem("fs-lang", lang); } catch (e) {} render(); };
render();
