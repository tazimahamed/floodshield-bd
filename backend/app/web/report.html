<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flood report · FloodShield BD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e5a8a'/%3E%3Cpath d='M5 19c3-3 5-3 8 0s5 3 8 0 5-3 6-1v6H5z' fill='%23fff'/%3E%3Cpath d='M16 5l7 4v4c0 3-3 5-7 6-4-1-7-3-7-6V9z' fill='%2389d0f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/report.css?v=18">
</head>
<body class="page dash-page">
  <header class="topbar">
    <a class="back" href="/" data-i18n="back"></a>
    <a class="brand small-brand" href="/">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M5 19c3-3 5-3 8 0s5 3 8 0 5-3 6-1v6H5z" fill="#fff"/><path d="M16 5l7 4v4c0 3-3 5-7 6-4-1-7-3-7-6V9z" fill="#89d0f5"/></svg></span>
      <b>FloodShield BD</b>
    </a>
    <nav class="secnav" id="secnav">
      <a href="#overview" data-i18n="navOverview"></a>
      <a href="#where" data-i18n="navMap"></a>
      <a href="#calendar" data-i18n="navCalendar"></a>
      <a href="#rain" data-i18n="navRain"></a>
      <a href="#cyclones" id="nav-cyc" data-i18n="navCyc"></a>
    </nav>
    <div class="top-actions">
      <a class="btn ghost small" href="/about" data-i18n="about"></a>
      <button id="print" class="btn small print-btn" data-i18n="print"></button>
      <button id="lang" class="btn ghost small">বাংলা</button>
    </div>
  </header>

  <main class="report dash">
    <section class="dash-hero" id="overview">
      <div class="hero-text">
        <p class="crumb" id="crumb"></p>
        <h1 id="title">…</h1>
        <p class="lead" id="lead"></p>
        <a id="tg" class="tg-cta" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg><span id="tg-t"></span></a>
        <a id="ffwc" class="ffwc-cta" href="https://www.ffwc.gov.bd/" target="_blank" rel="noopener"><span aria-hidden="true">🌊</span><span id="ffwc-t"></span></a>
      </div>
      <div id="now"></div>
    </section>

    <section class="kpis" id="tiles"></section>

    <div class="dash-grid" id="where">
      <section class="card map-card reveal">
        <div class="card-head">
          <div><h2 data-i18n="mapTitle"></h2><p class="sub" data-i18n="mapSub"></p></div>
          <div class="map-tools">
            <div class="seg-mini" role="group">
              <button id="bSat" class="on" data-i18n="baseSat"></button><button id="bMap" data-i18n="baseMap"></button>
            </div>
            <div class="seg-mini" role="group">
              <button id="v3d" class="on">3D</button><button id="v2d">2D</button>
            </div>
            <button id="bWx" class="wx-btn" hidden></button>
          </div>
        </div>
        <div class="map3d-wrap"><div id="map3d"></div><div id="mini-map" hidden></div><div id="map-hint" class="map-hint" hidden></div></div>
        <div class="map-legend" id="map-legend"></div>
        <p class="src" data-i18n="mapSrc"></p>
      </section>
      <section class="card rain-card reveal" id="rain-now">
        <div class="card-head">
          <div><h2 data-i18n="rainNowTitle"></h2><p class="sub" data-i18n="rainNowSub"></p></div>
        </div>
        <div class="rain-stats" id="rain-stats"></div>
        <div id="rain-chart" class="rain-chart"></div>
        <div class="chart-key"><span><i class="k past"></i><span data-i18n="keyPast"></span></span><span><i class="k next"></i><span data-i18n="keyNext"></span></span><span><i class="k line"></i><span data-i18n="keyCum"></span></span></div>
      </section>
    </div>

    <section class="card reveal" id="calendar">
      <div class="card-head">
        <div><h2 data-i18n="calTitle"></h2><p class="sub" data-i18n="calSub"></p></div>
        <a id="csv" class="btn ghost small" href="#" data-i18n="csv"></a>
      </div>
      <div class="cal-legend" id="cal-legend"></div>
      <div class="cal-wrap"><table class="cal" id="cal"></table></div>
    </section>

    <div class="grid2" id="rain">
      <section class="card reveal">
        <h2 data-i18n="rainTitle"></h2>
        <div id="rain-story"></div>
      </section>
      <section class="card reveal">
        <h2 data-i18n="monsoonTitle"></h2>
        <p class="sub" data-i18n="monsoonSub"></p>
        <div id="monsoon" class="ybars"></div>
      </section>
    </div>

    <section class="card reveal" id="cyclones" hidden>
      <h2 data-i18n="cycTitle"></h2>
      <div id="cyc"></div>
      <div class="cyc-map-wrap" id="cyc-map-wrap" hidden>
        <div id="cyc-map"></div>
        <div class="cyc-now" id="cyc-now"></div>
        <button class="cyc-replay" id="cyc-replay"></button>
      </div>
      <div class="cyc-legend" id="cyc-legend"></div>
      <p class="src" id="cyc-src"></p>
    </section>
    <p class="not-official" data-i18n="notOfficial"></p>
  </main>
  <div id="tip" class="tip" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/report.js?v=18"></script>
</body>
</html>
