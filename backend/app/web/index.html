<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloodShield BD</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="official" data-i18n="official"></div>
  <header>
    <div class="brand">
      <span class="logo">🌊</span>
      <div>
        <h1>FloodShield BD</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="controls">
      <select id="division"><option value="" data-i18n="allDivisions"></option></select>
      <div class="seg" id="lead">
        <button data-lead="rain_24h_mm">24h</button>
        <button data-lead="rain_48h_mm">48h</button>
        <button data-lead="rain_72h_mm" class="on">72h</button>
        <button data-lead="rain_past_72h_mm" data-i18n="past72"></button>
        <button data-lead="flood_prob" data-i18n="floodRisk"></button>
      </div>
      <label class="tog"><input type="checkbox" id="show-rivers" checked> <span data-i18n="rivers"></span></label>
      <label class="tog"><input type="checkbox" id="show-basins"> <span data-i18n="upstream"></span></label>
      <button id="lang" class="ghost">বাংলা</button>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <aside>
      <section class="card warn">
        <h2 data-i18n="floodTitle"></h2>
        <div id="flood-summary"><p data-i18n="floodEmpty"></p></div>
      </section>

      <section class="card">
        <h2 data-i18n="pastTitle"></h2>
        <select id="event"><option value="" data-i18n="pastNone"></option></select>
        <p id="event-info" class="muted small"></p>
      </section>

      <section class="card" id="detail" hidden>
        <h2 id="d-name"></h2>
        <p class="muted" id="d-where"></p>
        <div class="stats">
          <div><span id="d-past"></span><small data-i18n="past72"></small></div>
          <div><span id="d-24"></span><small>24h</small></div>
          <div><span id="d-72"></span><small>72h</small></div>
        </div>
        <canvas id="chart" height="140"></canvas>
        <p class="muted small" data-i18n="chartNote"></p>
        <div id="d-up" class="upbox"></div>
        <div id="d-assets" class="upbox"></div>
        <button id="ripple-btn" class="ripple-btn" data-i18n="rippleBtn"></button>
        <div id="ripple" class="upbox" hidden></div>
      </section>

      <section class="card">
        <h2 data-i18n="topTitle"></h2>
        <ol id="top"></ol>
      </section>

      <section class="card">
        <h2 data-i18n="sourceTitle"></h2>
        <p id="source" class="small"></p>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
