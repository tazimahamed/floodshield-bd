<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloodShield BD — Flood Early Warning for Bangladesh</title>
  <meta name="description" content="Upazila-level flood risk forecast, hourly rainfall and flood history for Bangladesh.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e5a8a'/%3E%3Cpath d='M5 19c3-3 5-3 8 0s5 3 8 0 5-3 6-1v6H5z' fill='%23fff'/%3E%3Cpath d='M16 5l7 4v4c0 3-3 5-7 6-4-1-7-3-7-6V9z' fill='%2389d0f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body class="app">
  <main class="stage">
    <div id="map" aria-label="Map of Bangladesh upazilas"></div>

    <!-- top-left: brand + search + view -->
    <div class="hud top-left">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="FloodShield BD home">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M5 19c3-3 5-3 8 0s5 3 8 0 5-3 6-1v6H5z" fill="#fff"/><path d="M16 5l7 4v4c0 3-3 5-7 6-4-1-7-3-7-6V9z" fill="#89d0f5"/></svg>
          </span>
          <span class="brand-text"><b>FloodShield BD</b><small data-i18n="tagline"></small></span>
        </a>
        <button id="hud-min" class="hud-min" aria-expanded="true" data-i18n-title="tMin">▴</button>
      </div>
      <div class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input id="search" type="search" autocomplete="off" data-i18n-ph="searchPh" aria-label="Search upazila">
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <div class="seg" id="view" role="tablist">
        <button data-view="risk" class="on" data-i18n="viewRisk"></button>
        <button data-view="rain" data-i18n="viewRain"></button>
        <button data-view="past" data-i18n="viewPast"></button>
        <button data-view="cyc" data-i18n="viewCyc"></button>
      </div>
      <div class="sub" data-for="risk">
        <label class="field"><span data-i18n="dateLabel"></span><input type="date" id="day" min="2017-01-31"></label>
        <button id="day-clear" class="btn small" data-i18n="today" hidden></button>
      </div>
      <div class="sub" data-for="rain" hidden>
        <div class="chips-row" id="lead">
          <button data-lead="rain_24h_mm" class="on" data-i18n="total24"></button>
          <button data-lead="rain_72h_mm" data-i18n="total72"></button>
          <button data-lead="rain_past_72h_mm" data-i18n="past72"></button>
        </div>
      </div>
      <div class="sub" data-for="past" hidden>
        <select id="event" aria-label="Past flood"></select>
      </div>
      <div class="sub cyc-sub" data-for="cyc" hidden>
        <div class="storm-cards" id="storm-cards"></div>
        <select id="cyclone" aria-label="All cyclones"></select>
      </div>
    </div>

    <!-- top-center: selected upazila summary -->
    <div id="strip" class="hud strip" hidden>
      <div class="strip-main">
        <div class="strip-name"><b id="s-name"></b><small id="s-where"></small></div>
        <div id="s-risk" class="strip-risk"></div>
      </div>
      <button id="strip-close" class="icon-btn" aria-label="Close">×</button>
    </div>

    <!-- right: icon rail -->
    <nav class="rail" aria-label="Map tools">
      <button id="r-home" data-i18n-title="tHome">⌂</button>
      <button id="r-search" data-i18n-title="tSearch">⌕</button>
      <button id="r-layers" data-i18n-title="tLayers">≋</button>
      <button id="r-theme" data-i18n-title="tTheme">◐</button>
      <button id="r-panel" data-i18n-title="tPanel" class="accent">☰</button>
      <a id="r-about" class="rail-link" href="/about" data-i18n-title="aboutLink">ⓘ</a>
      <button id="lang" class="lang">বাং</button>
    </nav>
    <div id="layers" class="hud layers" hidden>
      <h4 data-i18n="layersTitle"></h4>
      <select id="division" aria-label="Zoom to division"><option value="" data-i18n="allDivisions"></option></select>
      <label class="check"><input type="checkbox" id="show-rivers" checked><span data-i18n="rivers"></span></label>
      <label class="check"><input type="checkbox" id="show-basins"><span data-i18n="upstream"></span></label>
      <label class="check"><input type="checkbox" id="show-coast" checked><span data-i18n="coastLayer"></span></label>
      <label class="check"><input type="checkbox" id="show-water" checked><span data-i18n="waterLayer"></span></label>
      <label class="check" id="slide-row" hidden><input type="checkbox" id="show-slide"><span data-i18n="slideLayer"></span></label>
      <div class="slide-key" id="slide-key" hidden></div>
    </div>

    <!-- bottom: colour scale -->
    <div class="bottom">
      <div id="playbar" class="playbar" hidden>
        <button id="cyc-play" class="play" aria-label="Play">▶</button>
        <div class="pb-main">
          <div class="pb-top"><b id="pb-time"></b><span id="pb-cat" class="cat-badge"></span><span id="pb-wind"></span></div>
          <input id="pb-range" type="range" min="0" max="0" value="0" aria-label="Storm time">
          <div id="pb-days" class="pb-days"></div>
        </div>
      </div>
      <div id="scale" class="scale"></div>
    </div>
    <div id="map-loading" class="map-loading" hidden><span class="spinner"></span><span data-i18n="loading"></span></div>

    <!-- right drawer -->
    <aside class="drawer" id="side" aria-label="Details">
      <div class="drawer-head">
        <span id="drawer-title" data-i18n="overviewTitle"></span>
        <button id="drawer-close" class="icon-btn" aria-label="Close panel">×</button>
      </div>
      <div class="drawer-body">
        <div id="overview">
          <section class="panel storm-panel" id="storm-panel" hidden></section>
          <section class="panel status" id="status"></section>
          <section class="panel">
            <div class="panel-head"><h2 id="top-title"></h2></div>
            <ol id="top" class="rank"></ol>
          </section>
          <section class="panel wn-panel" id="wn-panel" hidden>
            <div class="panel-head"><h2 data-i18n="wnTitle"></h2></div>
            <div id="wn-sum"></div>
            <ol id="wn-top" class="rank"></ol>
            <p class="note" id="wn-note"></p>
          </section>
          <section class="panel tg-panel">
            <div class="panel-head"><h2 data-i18n="tgTitle"></h2></div>
            <p class="muted small" data-i18n="tgAllNote"></p>
            <a class="btn tg block" href="https://t.me/DurjogBartaBangladesh_bot" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg><span data-i18n="tgAll"></span></a>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="howTitle"></h2></div>
            <ul class="how">
              <li><b></b><span data-i18n="how1"></span></li>
              <li><b></b><span data-i18n="how2"></span></li>
              <li><b></b><span data-i18n="how3"></span></li>
            </ul>
          </section>
        </div>
        <div id="detail" hidden>
          <section class="panel">
            <button id="detail-close" class="btn ghost small" data-i18n="backOverview"></button>
            <h2 id="d-name" class="d-name"></h2>
            <p id="d-where" class="muted"></p>
            <div id="d-risk" class="risk-card"></div>
            <div id="d-water" class="wn-card" hidden></div>
            <div id="d-why" class="why-card" hidden></div>
            <div id="d-slide" class="wn-card slide-card" hidden></div>
            <a id="report-link" class="btn primary block" target="_blank" rel="noopener" data-i18n="reportBtn"></a>
            <a id="tg-link" class="btn tg block" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg><span data-i18n="tgBtn"></span></a>
            <p class="tg-note" data-i18n="tgNote"></p>
            <a id="shelter-link" class="btn ghost block shelter-btn" target="_blank" rel="noopener"><span aria-hidden="true">🏠</span><span data-i18n="shelterBtn"></span></a>
            <p class="tg-note" data-i18n="shelterNote"></p>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="rainTitle"></h2><span class="muted small">NOAA GFS</span></div>
            <div class="tiles">
              <div><span id="d-past"></span><small data-i18n="past72"></small></div>
              <div><span id="d-24"></span><small data-i18n="next24"></small></div>
              <div><span id="d-72"></span><small data-i18n="next72"></small></div>
            </div>
            <canvas id="chart" height="150" aria-label="Hourly rainfall chart"></canvas>
            <p class="muted small chart-key"><i class="sw past"></i><span data-i18n="chartPast"></span><i class="sw fut"></i><span data-i18n="chartFuture"></span></p>
          </section>
          <section class="panel" id="hosp-panel" hidden>
            <div class="panel-head"><h2 data-i18n="hospTitle"></h2></div>
            <ul id="d-hosp" class="hosp"></ul>
            <p class="note" id="hosp-note"></p>
          </section>
          <section class="panel" id="cyc-panel" hidden>
            <div class="panel-head"><h2 data-i18n="cycHistTitle"></h2></div>
            <div id="d-cyc"></div>
          </section>
          <section class="panel" id="outlook-panel" hidden>
            <div class="panel-head"><h2 id="outlook-title"></h2></div>
            <ul id="d-outlook" class="hosp"></ul>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="upTitle"></h2></div>
            <div id="d-up"></div>
          </section>
        </div>
        <a class="about-link" href="/about" data-i18n="aboutLink"></a>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="/static/app.js?v=23"></script>
  <script src="/static/coast.js?v=8"></script>
  <script src="/static/storms.js?v=2"></script>
</body>
</html>
